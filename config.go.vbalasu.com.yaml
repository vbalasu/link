# link shortener configuration for go.vbalasu.com (separate links from link.vbalasu.com).
domain: vbalasu.com              # Route53 hosted-zone name, used verbatim (any TLD).
subdomain: go                    # link host becomes go.vbalasu.com
stack_name: link-go-vbalasu-com  # explicit, so it doesn't collide with link-vbalasu-com
aws_region: us-east-1           # CloudFront requires the ACM cert in us-east-1.
aws_profile: vbalasu_admin       # AWS CLI/SDK profile to use.
root_redirect: ""                # bare-host fallback URL; empty => 404 on go.vbalasu.com/
